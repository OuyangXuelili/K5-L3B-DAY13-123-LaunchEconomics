# Phan Nguyễn Phan Anh — 2A202604004 · Nhiệm vụ D · Gate 2a
# Kế hoạch đề xuất, chưa triển khai và chưa có kết quả hay phê duyệt pilot.
# Tính lại D1/E1: cd src; python lab13.py. Mọi ngày/giờ dùng GMT+7.
#
# D1 · baseline 0,70; mục tiêu gốc +5 điểm; alpha 0,05; power 0,80; ICC 0,02.
# a) Theo yêu cầu: ceil(1250,7167) = 1.251 yêu cầu/nhóm; DE = 1.
# b) Theo nhân viên, m = 75: DE = 2,48; ceil(1.251 x 2,48) = 3.103 ca/nhóm; cần 42 người/nhóm, tổng 84 > 40.
# c) 20 nhân viên/nhóm: n hiệu dụng = 20m/(0,98 + 0,02m) < 1.000 < 1.251; kéo dài cũng không đủ cho +5 điểm.
# d) 6 depot/nhóm: n hiệu dụng < 6/0,02 = 300 < 1.251; chỉ 6 cụm/nhóm, dưới 20, nên loại.
# e) +6 điểm cần 859 mẫu độc lập/nhóm; m >= 859 x 0,98/(20 - 859 x 0,02) = 298,5177, làm tròn lên 299.
#    Với m = 299: DE = 6,96; n thực = 20 x 299 = 5.980/nhóm; n hiệu dụng = 859,1954 >= 859.
#
# D2 · Năm câu kiểm tra tách tác động:
# 1. Đối chứng cùng thời gian: 20 nhân viên tự làm trong cùng 12 depot và cùng cửa sổ với 20 nhân viên can thiệp.
# 2. Ngẫu nhiên: khóa roster 40 người, phân tầng theo depot, bốc thăm bằng seed 130004 và giữ nguyên phân nhóm.
# 3. Ảnh hưởng gián tiếp: có nguy cơ chia sẻ gợi ý; giới hạn tài khoản, hướng dẫn không chia sẻ và ghi log truy cập.
# 4. Viết trước: khóa chỉ số, MDE 6 điểm, cỡ mẫu, cửa sổ đo, luật dừng và ngày quyết định trước 2026-11-30.
# 5. Số cụm: 20 nhân viên/nhóm; depot là tầng phân nhóm, không phải đơn vị ngẫu nhiên.
#
# Đánh đổi: chọn staff, chấp nhận MDE 6 thay vì 5 điểm; nếu tác động thật +5 điểm, power khoảng 0,64, dưới 0,80.
# 859 là cỡ mẫu độc lập tương đương; số yêu cầu thực tế là 5.980/nhóm khi chia theo nhân viên.
# CSV chỉ có 20 staff/6 depot; kế hoạch 40 staff/12 depot cần roster thật, không lấy CSV làm danh sách toàn công ty.
# Mở lại lịch sử: 51/1.200 = 4,25%; trong scope: 39/982 = 3,97% (dữ liệu simulated).
# Ngưỡng đề xuất: chênh >= 2 điểm so với đối chứng hoặc tuyệt đối > 6%, thay vì đặt ngưỡng 3% dưới lịch sử.

